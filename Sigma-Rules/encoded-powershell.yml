title: Encoded PowerShell Command Execution
id: 2f6a4b91-18c3-47de-8a52-6dcbf0c7a934
status: experimental
description: Detects PowerShell execution using encoded command-line arguments, which may be used to obscure script content.
author: Monalisa Sonkusale
date: 2026-08-31

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_encoded:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-encodedcommand'
      - '-enc '
      - '-e '

  condition: selection_image and selection_encoded

falsepositives:
  - Legitimate administrative scripts using encoded commands
  - Software deployment tools
  - Approved automation frameworks

level: medium

tags:
  - attack.execution
  - attack.t1059.001
